<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆祝刘今顺利离婚！</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: bounce 1s ease infinite alternate;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #ffe0f0;
            margin-bottom: 30px;
            animation: fadeInUp 1.5s ease;
        }

        .message {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 600px;
            margin: 0 auto 30px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 2s ease;
        }

        .message p {
            color: #fff;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            line-height: 2;
        }

        .firework {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: firework 1.5s ease-out infinite;
            pointer-events: none;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: #fff;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s ease infinite;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(255,107,107,0.6);
        }

        .emoji-rain {
            position: fixed;
            font-size: 2rem;
            top: -50px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        .counter {
            color: #ffe0f0;
            font-size: 1.1rem;
            margin-top: 20px;
            animation: fadeInUp 3s ease;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes firework {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: scale(40); }
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 2s ease infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 热烈庆祝刘今顺利离婚 🎉</h1>
        <div class="subtitle">从此海阔凭鱼跃，天高任鸟飞！</div>

        <div class="message">
            <p>告别过去，拥抱未来</p>
            <p>愿刘今从此以后</p>
            <p>自由自在，无拘无束</p>
            <p>事业蒸蒸日上</p>
            <p>生活幸福美满</p>
            <p>🥂 干杯！🥂</p>
        </div>

        <button class="btn" onclick="celebrate()">点击放烟花！🎆</button>

        <div class="counter" id="counter"></div>
    </div>

    <script>
        // 烟花效果
        function createFirework(x, y) {
            const colors = ['#ff6b6b', '#ffd700', '#00ff87', '#ff69b4', '#00d4ff', '#ffa500', '#9b59b6'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 50 + Math.random() * 100;
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;
                particle.style.transition = 'all 1s ease-out';
                document.body.appendChild(particle);
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${dx}px, ${dy}px)`;
                });
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // 点击放烟花
        document.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });

        function celebrate() {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight * 0.6
                    );
                }, i * 200);
            }
        }

        // 表情雨
        const emojis = ['🎉', '🎊', '🥂', '🍾', '✨', '💫', '🌟', '🎆', '🎇', '💃', '🕺', '🦋'];
        function createEmojiRain() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-rain';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (3 + Math.random() * 4) + 's';
            emoji.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 7000);
        }
        setInterval(createEmojiRain, 300);

        // 闪烁星星
        function createSparkles() {
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * 100 + 'vh';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(sparkle);
            }
        }
        createSparkles();

        // 自由计时
        const startDate = new Date('2026-05-11T00:00:00');
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('counter').textContent =
                `自由已持续：${days}天 ${hours}小时 ${minutes}分 ${seconds}秒`;
        }
        updateCounter();
        setInterval(updateCounter, 1000);

        // 初始烟花
        setTimeout(celebrate, 500);
    </script>
</body>
</html>
