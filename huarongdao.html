<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>华容道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(135deg,#1a0a2e,#2d1b69,#1a0a2e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
h1{color:#ffd700;font-size:2.2rem;margin-bottom:8px;text-shadow:0 0 20px rgba(255,215,0,.5);letter-spacing:.3em}
#info{color:#bbb;font-size:.85rem;margin-bottom:12px}
#info span{color:#ffd700}
#board{position:relative;background:linear-gradient(145deg,#3a2a1a,#2a1a0a);border:4px solid #8b6914;border-radius:12px;box-shadow:0 0 40px rgba(139,105,20,.3),inset 0 0 30px rgba(0,0,0,.5)}
#exit{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:25%;height:4px;background:#0f0;border-radius:2px;box-shadow:0 0 15px #0f0}
.block{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;transition:left .15s ease,top .15s ease;box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 4px 8px rgba(0,0,0,.4);z-index:1}
.block:active{filter:brightness(1.2)}
.caocao{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;font-size:1.6rem;border:2px solid #f5c6cb}
.v{background:linear-gradient(135deg,#2980b9,#3498db);color:#fff;font-size:.9rem;border:2px solid #85c1e9}
.h{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;font-size:.9rem;border:2px solid #a9dfbf}
.soldier{background:linear-gradient(135deg,#8e44ad,#9b59b6);color:#fff;font-size:.75rem;border:2px solid #d2b4de}
#controls{margin-top:16px;display:flex;gap:12px}
#controls button{padding:10px 28px;font-size:1rem;font-family:inherit;background:linear-gradient(135deg,#8b6914,#a07828);color:#fff;border:1px solid #c8a040;border-radius:8px;cursor:pointer;transition:transform .1s}
#controls button:hover{transform:scale(1.05)}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);color:#ffd700;font-size:2rem;padding:30px 50px;border-radius:16px;border:2px solid #ffd700;z-index:100;display:none;text-align:center}
#msg div{font-size:1rem;color:#aaa;margin-top:10px}
#layoutSel{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#layoutSel button{padding:6px 16px;font-size:.8rem;background:rgba(139,105,20,.3);color:#ccc;border:1px solid #8b6914;border-radius:6px;cursor:pointer}
#layoutSel button.active{background:#8b6914;color:#fff}
</style>
</head>
<body>
<h1>华 容 道</h1>
<div id="info">步数：<span id="moves">0</span></div>
<div id="layoutSel"></div>
<div id="board"><div id="exit"></div></div>
<div id="controls">
<button onclick="resetGame()">重置</button>
<button onclick="undoMove()">撤销</button>
<button onclick="changeLayout()">换局</button>
</div>
<div id="msg">&#x1F389; 通关成功!<div id="msgSub"></div></div>

<script>
var COLS=4,ROWS=5,S=0;
var boardEl=document.getElementById('board');
var movesEl=document.getElementById('moves');
var msgEl=document.getElementById('msg');
var msgSubEl=document.getElementById('msgSub');
var moveCount=0,history=[],blocks=[],gameWon=false;

// Layouts
var LAYOUTS=[
{name:'横刀立马',blocks:[
{name:'曹操',w:2,h:2,x:1,y:0,cls:'caocao'},
{name:'张飞',w:1,h:2,x:0,y:0,cls:'v'},
{name:'赵云',w:1,h:2,x:3,y:0,cls:'v'},
{name:'马超',w:1,h:2,x:0,y:2,cls:'v'},
{name:'关羽',w:2,h:1,x:1,y:2,cls:'h'},
{name:'黄忠',w:1,h:2,x:3,y:2,cls:'v'},
{name:'兵',w:1,h:1,x:0,y:4,cls:'soldier'},
{name:'兵',w:1,h:1,x:1,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:2,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:3,y:4,cls:'soldier'}
]},
{name:'近在咫尺',blocks:[
{name:'曹操',w:2,h:2,x:1,y:0,cls:'caocao'},
{name:'张飞',w:1,h:2,x:0,y:0,cls:'v'},
{name:'赵云',w:1,h:2,x:3,y:0,cls:'v'},
{name:'马超',w:2,h:1,x:1,y:2,cls:'h'},
{name:'黄忠',w:1,h:2,x:0,y:2,cls:'v'},
{name:'关羽',w:1,h:2,x:3,y:2,cls:'v'},
{name:'兵',w:1,h:1,x:1,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:2,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:1,y:4,cls:'soldier'},
{name:'兵',w:1,h:1,x:2,y:4,cls:'soldier'}
]},
{name:'兵分三路',blocks:[
{name:'曹操',w:2,h:2,x:1,y:0,cls:'caocao'},
{name:'张飞',w:1,h:2,x:0,y:0,cls:'v'},
{name:'赵云',w:1,h:2,x:3,y:0,cls:'v'},
{name:'马超',w:2,h:1,x:1,y:2,cls:'h'},
{name:'黄忠',w:1,h:2,x:0,y:3,cls:'v'},
{name:'关羽',w:1,h:2,x:3,y:3,cls:'v'},
{name:'兵',w:1,h:1,x:1,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:2,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:1,y:4,cls:'soldier'},
{name:'兵',w:1,h:1,x:2,y:4,cls:'soldier'}
]},
{name:'峰回路转',blocks:[
{name:'曹操',w:2,h:2,x:1,y:0,cls:'caocao'},
{name:'张飞',w:1,h:2,x:0,y:0,cls:'v'},
{name:'赵云',w:1,h:2,x:3,y:0,cls:'v'},
{name:'马超',w:2,h:1,x:1,y:2,cls:'h'},
{name:'黄忠',w:1,h:2,x:0,y:2,cls:'v'},
{name:'关羽',w:2,h:1,x:1,y:3,cls:'h'},
{name:'兵',w:1,h:1,x:3,y:2,cls:'soldier'},
{name:'兵',w:1,h:1,x:3,y:3,cls:'soldier'},
{name:'兵',w:1,h:1,x:0,y:4,cls:'soldier'},
{name:'兵',w:1,h:1,x:3,y:4,cls:'soldier'}
]}
];
var layoutIdx=0;

// --- Input ---
var dragBlock=null,dragSX=0,dragSY=0,dragging=false,dragDir=null;

function getBlockEl(el){
while(el&&el!==boardEl){if(el.classList&&el.classList.contains('block'))return el;el=el.parentNode;}
return null;
}

function onPointerDown(cx,cy,el){
if(gameWon)return;
var bel=getBlockEl(el);
if(!bel)return;
// Find block data
var block=null;
for(var i=0;i<blocks.length;i++){if(blocks[i].el===bel){block=blocks[i];break;}}
if(!block)return;
dragBlock=block;dragSX=cx;dragSY=cy;dragging=true;dragDir=null;
}

function onPointerMove(cx,cy){
if(!dragging)return;
var dx=cx-dragSX,dy=cy-dragSY;
if(!dragDir&&Math.abs(dx)+Math.abs(dy)>10){
dragDir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
}
}

function onPointerUp(){
if(!dragging)return;
dragging=false;
var b=dragBlock;
dragBlock=null;
doMove(b,dragDir);
dragDir=null;
}

// Mouse - direct on board element
boardEl.addEventListener('mousedown',function(e){
e.preventDefault();
onPointerDown(e.clientX,e.clientY,e.target);
});
document.addEventListener('mousemove',function(e){onPointerMove(e.clientX,e.clientY);});
document.addEventListener('mouseup',function(){onPointerUp();});

// Touch
boardEl.addEventListener('touchstart',function(e){
var t=e.touches[0];
onPointerDown(t.clientX,t.clientY,e.target);
},{passive:true});
document.addEventListener('touchmove',function(e){
if(!dragging)return;
var t=e.touches[0];
onPointerMove(t.clientX,t.clientY);
},{passive:true});
document.addEventListener('touchend',function(){onPointerUp();});

// --- Movement ---
function doMove(block,dir){
var prefs;
if(block.w===2&&block.h===2){
prefs=['u','d','l','r'];
}else if(block.h===2){
if(dir==='u'||dir==='d')prefs=[dir,dir==='u'?'d':'u','l','r'];
else prefs=['u','d','l','r'];
}else if(block.w===2){
if(dir==='l'||dir==='r')prefs=[dir,dir==='l'?'r':'l','u','d'];
else prefs=['l','r','u','d'];
}else{
if(dir){var opp={u:'d',d:'u',l:'r',r:'l'};prefs=[dir,opp[dir]];}
else prefs=['u','d','l','r'];
}
var seen={},unique=[];
for(var i=0;i<prefs.length;i++){if(!seen[prefs[i]]){seen[prefs[i]]=1;unique.push(prefs[i]);}}
for(var i=0;i<unique.length;i++){if(tryStep(block,unique[i]))return;}
}

function tryStep(block,dir){
var dx=0,dy=0;
if(dir==='u')dy=-1;else if(dir==='d')dy=1;else if(dir==='l')dx=-1;else if(dir==='r')dx=1;
if(!canMove(block,dx,dy)){
if((block.w===2||block.h===2)&&canMove(block,dx*2,dy*2)){dx*=2;dy*=2;}
else return false;
}
history.push({state:blocks.map(function(b){return{x:b.x,y:b.y}}),moves:moveCount});
block.x+=dx;block.y+=dy;
moveCount++;
movesEl.textContent=moveCount;
block.el.style.left=block.x*S+2+'px';
block.el.style.top=block.y*S+2+'px';
if(block.name==='曹操'&&block.x===1&&block.y===3){
gameWon=true;
setTimeout(function(){msgSubEl.textContent='用了 '+moveCount+' 步';msgEl.style.display='block';},200);
}
return true;
}

function gridCells(block){
var g=[];
for(var dy=0;dy<block.h;dy++)for(var dx=0;dx<block.w;dx++)g.push((block.y+dy)*10+(block.x+dx));
return g;
}

function occupied(){
var s={};
for(var i=0;i<blocks.length;i++){
var b=blocks[i];
for(var dy=0;dy<b.h;dy++)for(var dx=0;dx<b.w;dx++)s[(b.y+dy)*10+(b.x+dx)]=b;
}
return s;
}

function canMove(block,dx,dy){
var occ=occupied();
var cells=gridCells(block);
for(var i=0;i<cells.length;i++){
var r=Math.floor(cells[i]/10),c=cells[i]%10;
var nr=r+dy,nc=c+dx;
if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return false;
var key=nr*10+nc;
if(occ[key]&&occ[key]!==block)return false;
}
return true;
}

function undoMove(){
if(history.length===0||gameWon)return;
var st=history.pop();
for(var i=0;i<blocks.length;i++){
blocks[i].x=st.state[i].x;
blocks[i].y=st.state[i].y;
blocks[i].el.style.left=blocks[i].x*S+2+'px';
blocks[i].el.style.top=blocks[i].y*S+2+'px';
}
moveCount=st.moves;
movesEl.textContent=moveCount;
}

function resetGame(){initGame();}
function changeLayout(){layoutIdx=(layoutIdx+1)%LAYOUTS.length;initGame();}

// --- Init ---
function calcSize(){
var mw=Math.min(window.innerWidth-24,500);
var mh=window.innerHeight-260;
S=Math.floor(Math.min(mw/COLS,mh/ROWS));
if(S<60)S=60;
}

function buildLayoutSel(){
var el=document.getElementById('layoutSel');
el.innerHTML='';
for(var i=0;i<LAYOUTS.length;i++){
var b=document.createElement('button');
b.textContent=LAYOUTS[i].name;
if(i===layoutIdx)b.className='active';
b.onclick=(function(idx){return function(){layoutIdx=idx;initGame();}})(i);
el.appendChild(b);
}
}

function initGame(){
calcSize();
boardEl.style.width=COLS*S+'px';
boardEl.style.height=ROWS*S+'px';
document.getElementById('exit').style.width=S+'px';
var lay=LAYOUTS[layoutIdx];
blocks=[];moveCount=0;history=[];gameWon=false;
movesEl.textContent='0';
msgEl.style.display='none';
var old=boardEl.querySelectorAll('.block');
for(var i=0;i<old.length;i++)old[i].remove();
for(var i=0;i<lay.blocks.length;i++){
var b=lay.blocks[i];
blocks.push({name:b.name,w:b.w,h:b.h,x:b.x,y:b.y,cls:b.cls,el:null});
}
for(var i=0;i<blocks.length;i++){
var b=blocks[i];
var el=document.createElement('div');
el.className='block '+b.cls;
el.style.width=b.w*S-4+'px';
el.style.height=b.h*S-4+'px';
el.style.left=b.x*S+2+'px';
el.style.top=b.y*S+2+'px';
el.textContent=b.cls==='soldier'?'兵':b.name;
boardEl.appendChild(el);
b.el=el;
}
buildLayoutSel();
}

initGame();
</script>
</body>
</html>
